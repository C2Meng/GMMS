<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trial and Leads</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/admin/dashboard.css" rel="stylesheet" />
  </head>

  <body class="min-vh-100 d-flex flex-column bg-fd-surface text-fd-on-surface">
    <header class="fd-detail-header w-100 d-flex align-items-center justify-content-between">
      <div class="fd-detail-header-left d-flex align-items-center gap-3">
        <button
          type="button"
          aria-label="Go Back"
          class="fd-detail-back d-inline-flex align-items-center justify-content-center rounded-circle"
        >
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="fd-detail-heading">
          <h1 class="fd-detail-title">Trial and Lead Details</h1>

          <span class="badge rounded-pill fw-semibold px-3 py-2">Active</span>
          <span class="badge rounded-pill fw-semibold px-3 py-2"
            >Unconverted</span
          >
          <div class="fd-detail-breadcrumb">
            <span>Trial and Leads</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span>Lead Details</span>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="fd-detail-action btn btn-fd-primary py-2 px-4 rounded-pill small"
      >
        Save
      </button>
    </header>

    <main class="flex-grow-1 px-4 px-md-5 pt-4 pb-5">
      <div class="container-fluid p-0">
        <div class="row g-5">
          <div class="col-12 col-md-4">
                <div class="mb-4">
                <label
                    for="name"
                    class="form-label small text-fd-on-surface-variant mb-2"
                    >Name</label
                >
                <input
                    id="name"
                    class="form-control rounded-0 shadow-none form-control-sm"
                    type="text"
                    value="username1"
                />
                </div>

                <div class="mb-4">
                    <label
                    for="phone"
                    class="form-label small text-fd-on-surface-variant mb-2"
                    >Phone</label
                    >
                    <input
                    id="phone"
                    class="form-control rounded-0 shadow-none form-control-sm"
                    type="text"
                    value="123-456-7890"
                    />
                </div>

                <div class="mb-4">
                    <label
                    for="email"
                    class="form-label small text-fd-on-surface-variant mb-2"
                    >Email</label
                    >
                    <input
                    id="email"
                    class="form-control rounded-0 shadow-none form-control-sm"
                    type="email"
                    value="user@example.com"
                    />
                </div>
          </div>


            <div class="col-12 col-md-4">
                <div class="mb-4">
                    

                    <label for="trial-start" class="form-label small text-fd-on-surface-variant mb-2">
                        Trial Start Date
                    </label>

                    <div class="input-group">
                       <input id="trial-start" class="form-control rounded-0 border-end-0 shadow-none form-control-sm" type="text" placeholder="mm/dd/yyyy" />
                    <span class="input-group-text rounded-0 bg-transparent border-start-0 text-fd-on-surface-variant">
                    <i class="bi bi-calendar3"></i>
                    </span>
                    </div>


                    


                </div>

                <div class="mb-4">
                    <label for="trial-end" class="form-label small text-fd-on-surface-variant mb-2">
                        Trial End Date
                    </label>

                    <div class="input-group">
                       <input id="trial-end" class="form-control rounded-0 border-end-0 shadow-none form-control-sm" type="text" placeholder="mm/dd/yyyy" />
                    <span class="input-group-text rounded-0 bg-transparent border-start-0 text-fd-on-surface-variant">
                    <i class="bi bi-calendar3"></i>
                    </span>
                    </div>


                    
                </div>

                <div class="mb-4">

                    <label for="entry-times" class="form-label small text-fd-on-surface-variant mb-2">Entry During Trial Period</label>
                    <input id="entry-times" class="form-control rounded-0 shadow-none form-control-sm" type="text" placeholder="Enter entry times" />
                </div>

                <div>

                    <label for="lead-source" class="form-label small text-fd-on-surface-variant mb-2">Lead Source</label>
                    <input id="lead-source" class="form-control rounded-0 shadow-none form-control-sm" type="text" placeholder="Enter lead source" />
                </div>
        
            </div>
            <div class="col-12 col-md-4 d-flex flex-column">


                <div class="mb-4">
                    <label for=""follow-up-date" class="form-label small text-fd-on-surface-variant mb-2">Follow Up Date</label>
                    <div class="input-group">
                        <input 
                            id="follow-up-date"
                            class="form-control rounded-0 border-end-0 shadow-none form-control-sm"
                            type="text"
                            value="10-August-2026"
                            />
                             <span class="input-group-text rounded-0 bg-transparent border-start-0 text-fd-on-surface-variant">
                            <i class="bi bi-calendar3"></i>
                            </span>
                    </div>


                </div>
                <div class="d-flex flex-column flex-grow-1">
                    <label for="notes" class="form-label small text-fd-on-surface-variant mb-2">Notes</label>
                    <textarea id="follow-up-notes" class="form-control rounded-0 shadow-none flex-grow-1" rows="12">This customer show high potential during trial class. Put more effort on this customer</textarea>
                </div>



            </div>
          </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin_sidebar.js"></script>
  </body>
</html>
