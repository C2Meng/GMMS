<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Username1 - Cancellation Request</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Project Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Frontdesk shared stylesheet -->
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/admin/dashboard.css" rel="stylesheet" />
  </head>

  <body class="d-flex flex-column min-vh-100 bg-fd-surface text-fd-on-surface">
    <header
      class="fd-detail-header w-100 d-flex align-items-center justify-content-between"
    >
      <div class="fd-detail-header-left d-flex align-items-center gap-3">
        <button
          type="button"
          class="fd-detail-back d-inline-flex align-items-center justify-content-center rounded-circle"
          aria-label="Go Back"
          onclick="history.back()"
        >
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="fd-detail-heading">
          <h1 class="fd-detail-title">USERNAME1 - CANCELLATION REQUEST</h1>
          <div class="fd-detail-breadcrumb">
            <span>Requests</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span>Cancellation Request</span>
          </div>
        </div>
      </div>

      <div class="fd-detail-actions">
        <button class="fd-detail-action btn btn-fd-primary" type="button">
          Proceed Request
        </button>

        <button class="fd-detail-action btn btn-fd-outline" type="button">
          Reject Request
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1 px-4 px-md-5 py-4">
      <!-- Content Area -->
      <div class="container-fluid px-0">
        <div class="row g-4">
          <!-- Left Column -->
          <section class="col-12 col-lg-7">
            <div class="fd-card no-hover h-100">
              <form>
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="name">Name</label>
                  <input
                    class="form-control"
                    id="name"
                    type="text"
                    value="Jane Doe"
                    readonly
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold" for="targetPlan"
                    >Target Plan</label
                  >
                  <input
                    class="form-control"
                    id="targetPlan"
                    type="text"
                    value="Premium Annual Membership"
                    readonly
                  />
                </div>

                <div class="mb-4">
                  <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-6">
                      <label
                        class="form-label fw-semibold"
                        for="nextBillingDate"
                      >
                        Next Billing Date
                      </label>
                      <input
                        class="form-control"
                        id="nextBillingDate"
                        type="text"
                        value="Nov 15, 2024"
                        readonly
                      />
                    </div>

                    <div class="col-12 col-md-6">
                      <span
                        class="badge text-bg-warning d-inline-flex align-items-center gap-2 px-3 py-2"
                      >
                        <i class="bi bi-exclamation-circle-fill"></i>
                        Less than 1 month
                      </span>
                    </div>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold" for="freezingPeriod">
                    Freezing Period
                  </label>
                  <input
                    class="form-control"
                    id="freezingPeriod"
                    type="text"
                    value="N/A"
                    readonly
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold" for="reason"
                    >Reason</label
                  >
                  <textarea class="form-control" id="reason" rows="4" readonly>
Relocating to another city for work next month. Need to cancel effective immediately as I won't be able to utilize the facility.</textarea
                  >
                </div>

                <div>
                  <label class="form-label fw-semibold">Attachment</label>

                  <div
                    class="d-flex align-items-center justify-content-between gap-3 border rounded-2 p-3 bg-fd-surface-container-lowest"
                  >
                    <div class="d-flex align-items-center gap-2 min-w-0">
                      <i
                        class="bi bi-file-earmark-pdf-fill text-danger fs-5"
                      ></i>
                      <span class="fw-medium text-truncate"
                        >medical_receipt.pdf</span
                      >
                    </div>

                    <button
                      class="btn btn-link p-1 text-fd-primary"
                      type="button"
                      aria-label="View Attachment"
                    >
                      <i class="bi bi-eye fs-5"></i>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </section>

          <!-- Right Column -->
          <section class="col-12 col-lg-5">
            <div class="fd-card no-hover h-100 d-flex flex-column">
              <div
                class="d-flex flex-column align-items-center justify-content-center text-center flex-grow-1 py-5 px-4"
              >
                <span
                  class="material-symbols-outlined fs-1 mb-3 text-fd-primary"
                >
                  description
                </span>

                <h2 class="fs-4 fw-bold mb-3">Contract Preview</h2>

                <p class="mb-0 text-fd-on-surface-variant">
                  The member's signed contract will appear here when the
                  attachment is viewed or if a digital signature is required for
                  cancellation.
                </p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin_sidebar.js"></script>
  </body>
</html>
