<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="../css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-fd-surface-container-low fd-readable-list">
    <div>
      <div class="container-fluid px-3 px-md-5 py-4 py-md-5">
        <div class="fd-card no-hover mx-auto" style="max-width: 1100px">
          <!-- Card content for sessions -->
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div class="d-flex align-items-baseline gap-2">
              <h4 class="fw-bold mb-0">Requests</h4>
              <span class="small text-fd-on-surface-variant"
                >12 total &middot; 7 active</span
              >
            </div>

            <div
              class="d-flex align-items-center gap-4 flex-grow-1 justify-content-end"
            >
              <div
                class="input-group rounded-pill border overflow-hidden"
                style="max-width: 320px"
              >
                <span class="input-group-text bg-white border-0 ps-3 pe-1"
                  ><i class="bi bi-search text-fd-on-surface-variant"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-0 py-2"
                  placeholder="Search for session"
                  aria-label="Search for session"
                />
              </div>

              <a
                href="#"
                class="fd-text-link d-inline-flex align-items-center gap-1 text-nowrap"
              >
                <i class="bi bi-funnel"></i> Add Session
              </a>
            </div>
          </div>

          <!-- Sessions table -->
          <div class="responsive-table justify-content-end">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="select-all-sessions"
                      for="select-all-sessions"
                    />
                  </th>
                  <th class="text-uppercase small fw-bold text-fd-on-surface">
                    ID
                    <i class="bi bi-chevron-up text-fd-primary small ms-1"></i>
                  </th>
                  <th class="text-uppercase small fw-bold text-fd-on-surface">
                    Name
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                  <th
                    class="text-uppercase small fw-bold text-fd-on-surface-variant"
                  >
                    EMAIL
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                  <th
                    class="text-uppercase small fw-bold text-fd-on-surface-variant"
                  >
                    DATE OF REQUEST
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                  <th
                    class="text-uppercase small fw-bold text-fd-on-surface-variant"
                  >
                    TYPE
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                  <th class="text-uppercase small fw-bold text-fd-on-surface">
                    REASON
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                  <th class="text-uppercase small fw-bold text-fd-on-surface">
                    Action
                    <i
                      class="bi bi-chevron-expand text-fd-on-surface-variant small ms-1"
                    ></i>
                  </th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="session-1"
                      for="session-1"
                    />
                  </td>
                  <td class="fw-bold text-fd-on-surface">1</td>
                  <td class="small text-fd-on-surface-variant">YOGA SESSION</td>
                  <td class="small text-fd-on-surface">YOGA</td>
                  <td class="small text-fd-on-surface">MONDAY</td>
                  <td class="small text-fd-on-surface">2023-10-10</td>
                  <td class="small text-fd-on-surface">$20.00</td>
                  <td>
                    <div class="px-4">
                      <i
                        class="bi bi-chevron-down text-fd-on-surface-variant"
                      ></i>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td>
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="session-1"
                      for="session-1"
                    />
                  </td>
                  <td class="fw-bold text-fd-on-surface">2</td>
                  <td class="text-fd-on-surface">Yoga Session</td>
                  <td class="text-fd-on-surface">Yoga</td>
                  <td class="text-fd-on-surface">Monday</td>
                  <td class="text-fd-on-surface">2023-10-10</td>
                  <td class="text-fd-on-surface">$20.00</td>
                  <td>
                    <div class="px-4">
                      <i
                        class="bi bi-chevron-down text-fd-on-surface-variant"
                      ></i>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td>
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="session-1"
                      for="session-1"
                    />
                  </td>
                  <td class="fw-bold text-fd-on-surface">3</td>
                  <td class="text-fd-on-surface">Yoga Session</td>
                  <td class="text-fd-on-surface">Yoga</td>
                  <td class="text-fd-on-surface">Monday</td>
                  <td class="text-fd-on-surface">2023-10-10</td>
                  <td class="text-fd-on-surface">$20.00</td>
                  <td>
                    <div class="px-4">
                      <i
                        class="bi bi-chevron-down text-fd-on-surface-variant"
                      ></i>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td>
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="session-1"
                      for="session-1"
                    />
                  </td>
                  <td class="fw-bold text-fd-on-surface">4</td>
                  <td class="text-fd-on-surface">Yoga Session</td>
                  <td class="text-fd-on-surface">Yoga</td>
                  <td class="text-fd-on-surface">Monday</td>
                  <td class="text-fd-on-surface">2023-10-10</td>
                  <td class="text-fd-on-surface">$20.00</td>
                  <td>
                    <div class="px-4">
                      <i
                        class="bi bi-chevron-down text-fd-on-surface-variant"
                      ></i>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
