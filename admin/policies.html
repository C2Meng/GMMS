<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policies</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Project fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Existing project stylesheet -->
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/admin/dashboard.css" rel="stylesheet" />
  </head>

  <body class="bg-fd-surface text-fd-on-surface">
    <header
      class="fd-detail-header w-100 d-flex align-items-center justify-content-between"
    >
      <div class="fd-detail-header-left d-flex align-items-center gap-3">
        <button
          type="button"
          class="fd-detail-back d-inline-flex align-items-center justify-content-center rounded-circle"
          aria-label="Go Back"
          onclick="history.back()"
        >
          <i class="bi bi-arrow-left"></i>
        </button>
        <div class="fd-detail-heading">
          <h1 class="fd-detail-title">Policies</h1>
          <div class="fd-detail-breadcrumb">
            <span>Administration</span>
            <span class="material-symbols-outlined">chevron_right</span>
            <span>Policies</span>
          </div>
        </div>
      </div>
    </header>
    <main class="container-fluid py-4 py-md-5 px-3 px-md-5">
      <div class="container-fluid p-0">
        <div class="row g-4">
          <!-- Card 1: Cancellation Policy -->
          <div class="col-12 col-md-6 col-lg-4">
            <section class="fd-card no-hover h-100 d-flex flex-column">
              <h3 class="h5 fw-bold mb-4 pb-2 border-bottom text-fd-on-surface">
                Cancellation Policy
              </h3>

              <div class="d-flex flex-column gap-3">
                <div>
                  <label
                    for="notice-period"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Notice Period
                  </label>
                  <div class="position-relative">
                    <input
                      id="notice-period"
                      class="form-control text-end pe-5"
                      type="number"
                      value="1"
                    />
                    <span
                      class="position-absolute top-50 end-0 translate-middle-y me-3 small text-fd-on-surface-variant"
                    >
                      month
                    </span>
                  </div>
                </div>

                <div>
                  <label
                    for="post-effective-period"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Post Effective Period
                  </label>
                  <div class="position-relative">
                    <input
                      id="post-effective-period"
                      class="form-control text-end pe-5"
                      type="number"
                      value="60"
                    />
                    <span
                      class="position-absolute top-50 end-0 translate-middle-y me-3 small text-fd-on-surface-variant"
                    >
                      day
                    </span>
                  </div>
                </div>

                <div>
                  <label
                    for="late-submission-fee"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Penalty Fee For Late Submission
                  </label>
                  <div class="position-relative">
                    <span
                      class="position-absolute top-50 start-0 translate-middle-y ms-3 small text-fd-on-surface-variant"
                    >
                      RM
                    </span>
                    <input
                      id="late-submission-fee"
                      class="form-control text-end ps-5"
                      step="0.01"
                      type="number"
                      value="200.00"
                    />
                  </div>
                </div>

                <div>
                  <label
                    for="cancellation-template"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Form Template
                  </label>

                  <div
                    class="border rounded p-3 bg-fd-surface-container-lowest"
                  >
                    <div
                      class="d-flex align-items-center justify-content-between gap-3 mb-3"
                    >
                      <div class="d-flex align-items-center gap-2">
                        <i
                          class="bi bi-file-earmark-pdf-fill text-danger"
                          aria-hidden="true"
                        ></i>
                        <span class="fw-medium text-fd-on-surface"
                          >cancellation.pdf</span
                        >
                      </div>
                      <button
                        type="button"
                        class="btn btn-link p-0 text-fd-on-surface-variant"
                        title="View cancellation.pdf"
                        aria-label="View cancellation.pdf"
                      >
                        <i class="bi bi-eye" aria-hidden="true"></i>
                      </button>
                    </div>

                    <input
                      id="cancellation-template"
                      class="form-control"
                      type="file"
                      accept="application/pdf,.pdf"
                    />
                  </div>
                </div>
              </div>
            </section>
          </div>

          <!-- Card 2: Account Freezing Policy -->
          <div class="col-12 col-md-6 col-lg-4">
            <section class="fd-card no-hover h-100 d-flex flex-column">
              <h3 class="h5 fw-bold mb-4 pb-2 border-bottom text-fd-on-surface">
                Account Freezing Policy
              </h3>

              <div class="d-flex flex-column gap-3">
                <div>
                  <label
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Freezing Duration
                  </label>

                  <div class="row g-2 align-items-center">
                    <div class="col-5">
                      <label
                        for="freezing-min"
                        class="form-label text-uppercase small text-fd-on-surface-variant mb-1"
                      >
                        Min
                      </label>
                      <input
                        id="freezing-min"
                        class="form-control text-center"
                        type="number"
                        value="1"
                      />
                    </div>

                    <div class="col-5">
                      <label
                        for="freezing-max"
                        class="form-label text-uppercase small text-fd-on-surface-variant mb-1"
                      >
                        Max
                      </label>
                      <input
                        id="freezing-max"
                        class="form-control text-center"
                        type="number"
                        value="3"
                      />
                    </div>

                    <div class="col-2 text-end">
                      <span class="small text-fd-on-surface-variant"
                        >month</span
                      >
                    </div>
                  </div>
                </div>

                <div>
                  <label
                    for="freezing-fee"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Freezing Fee Per Month
                  </label>
                  <div class="position-relative">
                    <span
                      class="position-absolute top-50 start-0 translate-middle-y ms-3 small text-fd-on-surface-variant"
                    >
                      RM
                    </span>
                    <input
                      id="freezing-fee"
                      class="form-control text-end ps-5"
                      step="0.01"
                      type="number"
                      value="20.00"
                    />
                  </div>
                </div>

                <div>
                  <label
                    for="freezing-template"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Form Template
                  </label>

                  <div
                    class="border rounded p-3 bg-fd-surface-container-lowest"
                  >
                    <div
                      class="d-flex align-items-center justify-content-between gap-3 mb-3"
                    >
                      <div class="d-flex align-items-center gap-2">
                        <i
                          class="bi bi-file-earmark-pdf-fill text-danger"
                          aria-hidden="true"
                        ></i>
                        <span class="fw-medium text-fd-on-surface"
                          >freezing.pdf</span
                        >
                      </div>
                      <button
                        type="button"
                        class="btn btn-link p-0 text-fd-on-surface-variant"
                        title="View freezing.pdf"
                        aria-label="View freezing.pdf"
                      >
                        <i class="bi bi-eye" aria-hidden="true"></i>
                      </button>
                    </div>

                    <input
                      id="freezing-template"
                      class="form-control"
                      type="file"
                      accept="application/pdf,.pdf"
                    />
                  </div>
                </div>
              </div>
            </section>
          </div>

          <!-- Card 3: Attendance and Missed Class Policy -->
          <div class="col-12 col-md-6 col-lg-4">
            <section class="fd-card no-hover h-100 d-flex flex-column">
              <h3 class="h5 fw-bold mb-4 pb-2 border-bottom text-fd-on-surface">
                Attendance and Missed Class Policy
              </h3>

              <div class="d-flex flex-column gap-4">
                <div class="form-check d-flex gap-3 align-items-start ps-0">
                  <input
                    id="class-replacement"
                    class="form-check-input m-0 flex-shrink-0"
                    type="checkbox"
                  />
                  <label for="class-replacement" class="form-check-label">
                    <span class="d-block fw-medium text-fd-on-surface mb-1">
                      Class Replacement
                    </span>
                    <span
                      class="d-block small lh-base text-fd-on-surface-variant"
                    >
                      (Missed classes will be given back to the member as
                      replacements, with no cap on the amount or time limit)
                    </span>
                  </label>
                </div>

                <div>
                  <label
                    for="missed-class-fee"
                    class="form-label small fw-semibold text-fd-on-surface-variant"
                  >
                    Missed Class Penalty Fee
                  </label>
                  <div class="position-relative">
                    <span
                      class="position-absolute top-50 start-0 translate-middle-y ms-3 small text-fd-on-surface-variant"
                    >
                      RM
                    </span>
                    <input
                      id="missed-class-fee"
                      class="form-control text-end ps-5"
                      step="0.01"
                      type="number"
                      value="0.00"
                    />
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JavaScript bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/admin_sidebar.js"></script>
  </body>
</html>
