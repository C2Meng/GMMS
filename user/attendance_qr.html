<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner - Gym System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Global CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="app-body">

    <!-- White Mask Overlay for Background -->
    <div class="app-mask"></div>

    <!-- Central Mobile Frame -->
    <div class="mobile-frame shadow-lg d-flex flex-column bg-white">
        
        <!-- Header -->
        <div class="app-header d-flex justify-content-between align-items-center p-3 sticky-top z-3">
            <div class="d-flex align-items-center gap-2">
                <a href="user_dashboard.html">
                    <img src="images/company-logo1.png" alt="Frontdesk" class="app-header-logo">
                </a>
                <span class="app-header-username">Username</span>
            </div>
            <div>
                <!-- Close button to return to dashboard -->
                <a href="user_dashboard.html" class="text-dark text-decoration-none">
                    <i class="bi bi-x-lg fs-4"></i>
                </a>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="frame-content px-4 py-5 d-flex flex-column align-items-center justify-content-center flex-grow-1">
            
            <!-- Instructions -->
            <h3 class="text-center fw-bold mb-5" style="font-size: 1.4rem; line-height: 1.3;">
                Present Your QR Code<br>to the Scanner for Entry<br>and Attendance.
            </h3>

            <!-- QR Code Image -->
            <div class="mb-5">
                <img src="images/qr-code.png" alt="User QR Code" class="img-fluid" style="width: 220px; height: 220px;">
            </div>

            <!-- Generic Striped Table -->
            <table class="app-table-striped-primary mb-3">
                <tbody>
                    <tr>
                        <td>Name</td>
                        <td>Username</td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>user@email.com</td>
                    </tr>
                    <tr>
                        <td>Phonenumber</td>
                        <td>012-3456789</td>
                    </tr>
                </tbody>
            </table>
            
        </div> 
    </div> 

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Global Custom Script -->
    <script src="js/script.js"></script>
</body>
</html>
