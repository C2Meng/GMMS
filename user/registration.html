<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gym System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons (For the password eye icon) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS Linked -->
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/auth.css" rel="stylesheet"> 

</head>
<body>

    <div class="container-fluid p-0 login-page">
        <div class="row m-0 h-100">
            
            <!-- Left Panel -->
            <div class="col-12 col-md-8 col-lg-7 p-0">
                <div class="login-panel">
                    
                    <!-- Logo Section -->
                    <div class="mb-auto">
                        <a href="../landing/index.html">
                            <img src="../images/company-logo1.png" alt="Frontdesk Logo" style="height: 45px;">
                        </a>
                    </div>
                    
                    <!-- Registration Form Section -->
                    <div class="login-form-wrapper py-4">
                        <h2 class="fw-bold mb-4" style="letter-spacing: -0.5px;">ACCOUNT REGISTRATION</h2>
                        
                        <form>
                            <!-- Name -->
                            <div class="mb-3">
                                <label for="nameInput" class="form-label">Name</label>
                                <input type="text" class="form-control" id="nameInput" placeholder="example: John Lee" required>
                            </div>
                            
                            <!-- Password -->
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="passwordInput" placeholder="6 character and 1 symbol" required>
                                    <span class="input-group-text bg-white border-start-0" style="border-radius: 0 6px 6px 0; border-color: #ced4da; cursor: pointer;">
                                        <i class="bi bi-eye text-muted"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="confirmPasswordInput" placeholder="6 character and 1 symbol" required>
                                    <span class="input-group-text bg-white border-start-0" style="border-radius: 0 6px 6px 0; border-color: #ced4da; cursor: pointer;">
                                        <i class="bi bi-eye text-muted"></i>
                                    </span>
                                </div>
                            </div>

                            <!-- Phone Number -->
                            <div class="mb-3">
                                <label for="phoneInput" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneInput" placeholder="+6013421222" required>
                            </div>

                            <!-- Date of Birth (Formatted to match design) -->
                            <div class="mb-3">
                                <label class="form-label">Date of Birth</label>
                                <div class="d-flex align-items-center form-control" style="padding: 0.25rem 1rem;">
                                    <input type="text" class="form-control border-0 text-center px-0 shadow-none" placeholder="DD" maxlength="2" required>
                                    <span class="text-muted mx-2">/</span>
                                    <input type="text" class="form-control border-0 text-center px-0 shadow-none" placeholder="MM" maxlength="2" required>
                                    <span class="text-muted mx-2">/</span>
                                    <input type="text" class="form-control border-0 text-center px-0 shadow-none" placeholder="YY" maxlength="2" required>
                                </div>
                            </div>

                            <!-- Sex -->
                            <div class="mb-4">
                                <label for="sexInput" class="form-label">Sex</label>
                                <select class="form-select text-muted" id="sexInput" required style="border-radius: 6px; padding: 0.75rem 1rem; border: 1px solid #ced4da; font-size: 0.85rem;">
                                    <option value="" selected disabled>Select your biological sex</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>

                            <!-- Terms Checkbox -->
                            <div class="mb-4 d-flex">
                                <div class="form-check me-2">
                                    <!-- Added a solid border and ensured the background is white -->
                                    <input class="form-check-input shadow-none" type="checkbox" id="termsCheck" required style="margin-top: 0.2rem; border: 3px solid #ced4da; background-color: #ffffff;">
                                </div>
                                <label class="form-check-label text-muted" for="termsCheck" style="font-size: 0.75rem; line-height: 1.4;">
                                    By checking this box and confirming below, I acknowledge that I have read, understood, and agree to 
                                    <a href="#" class="text-dark text-decoration-underline">FrontDesk's Terms of Service, Privacy Policy, and any applicable User Agreement governing the use of the platform.</a>
                                </label>
                            </div>
                            
                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-black w-100">Register</button>
                            
                        </form>
                    </div>

                </div>
            </div>
            
            <!-- Right side remains empty -->
            <div class="col-12 col-md-4 col-lg-5 p-0 d-none d-md-block"></div>
            
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
