<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Gym System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Global CSS -->
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-body">

    <!-- White Mask Overlay for Background -->
    <div class="app-mask"></div>

    <!-- Central Mobile Frame -->
    <div class="mobile-frame shadow-lg d-flex flex-column bg-white">
        
        <!-- Global Header -->
        <div class="app-header d-flex justify-content-between align-items-center p-3 sticky-top z-3">
            <div class="d-flex align-items-center gap-2">
                <a href="user_dashboard.html">
                    <img src="../images/company-logo1.png" alt="Frontdesk" class="app-header-logo">
                </a>
                <span class="app-header-username">Username</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                    <a href="user_profile.html">
                        <span class="app-header-badge badge rounded-pill text-dark d-flex align-items-center gap-1 px-3 py-1">
                            Active <i class="bi bi-person-circle"></i>
                        </span>
                    </a>
                <a href="qr-scanner.html" class="text-decoration-none">
                    <i class="bi bi-qr-code-scan fs-4 text-primary"></i>
                </a>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="frame-content pb-4 flex-grow-1 overflow-auto">
            
            <!-- Breadcrumb -->
            <div class="app-breadcrumb mb-2">
                <a href="user_dashboard.html">Dashboard</a> &gt; My Profile
            </div>

            <div class="px-3 pb-4">
                
                <!-- Title & Edit Button (Now triggers modal) -->
                <h3 class="fw-bold mb-3" style="font-size: 1.4rem;">My Profile</h3>
                <div class="text-end mb-3">
                    <button type="button" class="btn btn-sm fw-bold px-3 py-2 text-dark shadow-sm border-0" data-bs-toggle="modal" data-bs-target="#editProfileModal" style="background-color: var(--fd-mobile-primary, #89CFF0); border-radius: 0.4rem; font-size: 0.8rem;">
                        Edit profile
                    </button>
                </div>

                <!-- Profile Card -->
                <div class="card border rounded-4 shadow-sm p-3">
                    
                    <!-- Profile Header -->
                    <div class="d-flex align-items-center gap-3 mb-4 mt-2 px-2">
                        <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 70px; height: 70px; background-color: #0099ff;">
                            <i class="bi bi-person text-white" style="font-size: 2.5rem;"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1">Jane Doe</h4>
                            <span class="badge rounded-pill bg-success bg-opacity-10 text-success border border-success px-3 fw-bold" style="font-size: 0.65rem;">Active</span>
                        </div>
                    </div>

                    <!-- Profile Details List -->
                    <div class="d-flex flex-column gap-3 px-2">
                        
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-envelope fs-5"></i>
                                <span>Email</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">jane.doe@gmail.com</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-telephone fs-5"></i>
                                <span>Phone</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">+60 12-345 6789</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-calendar4 fs-5"></i>
                                <span>Plan</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">Standard Membership</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-square-fill" style="color: #e9ecef;"></i>
                                <span>Member since</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">14 Feb 2025</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-square-fill" style="color: #e9ecef;"></i>
                                <span>Membership Expiry Date</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">14 Aug 2025</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-square-fill" style="color: #e9ecef;"></i>
                                <span>info category</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">info</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                            <div class="d-flex align-items-center gap-3 text-muted" style="font-size: 0.8rem;">
                                <i class="bi bi-square-fill" style="color: #e9ecef;"></i>
                                <span>info category</span>
                            </div>
                            <div class="text-dark fw-bold" style="font-size: 0.75rem;">info</div>
                        </div>

                    </div>
                </div>

            </div> 
        </div> 
    </div> 

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-3">
            <div class="modal-content border-0 shadow rounded-4">
                
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" style="font-size: 1.1rem;">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body pb-2">
                    <form>
                        <!-- Name Input -->
                        <div class="mb-3">
                            <label for="editName" class="form-label fw-bold text-dark mb-1" style="font-size: 0.8rem;">Full Name</label>
                            <input type="text" class="form-control" id="editName" value="Jane Doe" style="font-size: 0.85rem; border-color: #ced4da;">
                        </div>
                        
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="editEmail" class="form-label fw-bold text-dark mb-1" style="font-size: 0.8rem;">Email Address</label>
                            <input type="email" class="form-control" id="editEmail" value="jane.doe@gmail.com" style="font-size: 0.85rem; border-color: #ced4da;">
                        </div>
                        
                        <!-- Phone Input -->
                        <div class="mb-4">
                            <label for="editPhone" class="form-label fw-bold text-dark mb-1" style="font-size: 0.8rem;">Phone Number</label>
                            <input type="tel" class="form-control" id="editPhone" value="+60 12-345 6789" style="font-size: 0.85rem; border-color: #ced4da;">
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-light border fw-bold flex-fill py-2" data-bs-dismiss="modal" style="font-size: 0.85rem;">Cancel</button>
                            <button type="submit" class="btn fw-bold text-dark flex-fill py-2 border-0" style="background-color: var(--fd-mobile-primary, #89CFF0); font-size: 0.85rem;">Save Changes</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Global Custom Script -->
    <script src="../js/script.js"></script>
</body>
</html>
