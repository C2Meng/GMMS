<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 1. Global CSS (Shared design tokens, colors, and base styles) -->
    <link href="css/style.css" rel="stylesheet">
    
    <!-- 2. Auth CSS (Specific styles only for Login and Registration pages) -->
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>

    <div class="container-fluid p-0 login-page">
        <div class="row m-0 h-100">
            
            <!-- Left Panel -->
            <div class="col-12 col-md-8 col-lg-7 p-0">
                <div class="login-panel">
                    
                    <!-- Logo Section -->
                    <div class="mb-auto">
                        <a href="index.html">
                            <img src="images/company-logo1.png" alt="Frontdesk Logo" style="height: 45px;">
                        </a>
                    </div>
                    
                    <!-- Login Form Section -->
                    <div class="login-form-wrapper">
                        <h1 class="fw-bold mb-1" style="letter-spacing: -0.5px;">WELCOME BACK</h1>
                        <p class="text-muted mb-4" style="font-size: 0.9rem;">
                            Don't have an account? <a href="registration.html" class="text-link">Create an account</a>
                        </p>
                        
                        <form>
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="Your email" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="passwordInput" class="form-label">Password</label>
                                <input type="password" class="form-control" id="passwordInput" placeholder="Your password" required>
                            </div>
                            
                            <a href="user_dashboard.html"><button type="button" class="btn btn-black w-100 mb-2">Login</button></a>
                            
                            <div>
                                <a href="#" class="text-muted" style="font-size: 0.8rem; text-decoration: none;">Forgot your password?</a>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
            
            <!-- Right side remains empty -->
            <div class="col-12 col-md-4 col-lg-5 p-0 d-none d-md-block"></div>
            
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
